# kodepiia

- type: entity
  parent: BoxCardboard
  id: BoxSurvivalKodepiia
  name: survival box
  description: It's a box with basic internals inside. Something smells funny...
  suffix: Meat
  components:
  - type: StorageFill
    contents:
    - id: ClothingMaskBreath
    - id: EmergencyOxygenTankFilled
    - id: EmergencyMedipen
    - id: Flare
    - id: FoodMeatBacon
    - id: Bloodpack
  - type: Sprite
    sprite: _MACRO/Objects/Storage/boxes.rsi
    layers:
    - state: box2
    - state: label

- type: entity
  parent: BoxSurvivalKodepiia
  id: BoxHugKodepiia
  name: box of hugs
  description: A special box for sensitive people. Something smells funny...
  suffix: Meat
  components:
  - type: Sprite
    layers:
    - state: boxofyuckyhugs
    - state: label
  - type: Item
    heldPrefix: hug
  - type: StorageFill
    contents:
    - id: ClothingMaskBreath
    - id: EmergencyFunnyOxygenTankFilled
    - id: EmergencyMedipen
    - id: Flare
    - id: FoodMeatBacon
    - id: Bloodpack
  - type: Tag
  tags:
  - BoxHug
    
- type: entity
  parent: BoxSurvival
  id: BoxSurvivalAquatic
  suffix: Standard H2O
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: PillEmergency
        - id: Flare
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleLargeFull
  - type: Sprite
    sprite: _MACRO/Objects/Storage/boxes.rsi
    layers:
    - state: internals
    - state: vaportank
  - type: Label
    currentLabel: H2O

- type: entity
  parent: BoxSurvivalAquatic
  id: BoxSurvivalEngineeringAquatic
  suffix: Extended, H2O
  name: extended-capacity survival box
  description: It's a box with basic internals inside. This one is labelled to contain an extended-capacity water bottle.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkWaterBottleTallFull
        - id: ClothingMaskBreath
        - id: PillEmergency
        - id: Flare
        - id: FoodSnackNutribrick
  - type: Sprite
    sprite: _MACRO/Objects/Storage/boxes.rsi
    layers:
    - state: internals
    - state: extendedtankvapor

