- type: reagent
  id: GrayBlood
  name: reagent-name-gray-blood
  group: Biological
  parent: Radium
  desc: reagent-desc-gray-blood
  physicalDesc: reagent-physical-desc-glowing

- type: reaction
  id: GrayBloodBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    GrayBlood:
      amount: 5
  products:
    Radium: 5

- type: reagent
  id: Mucin
  name: reagent-name-mucin
  group: Biological
  desc: reagent-desc-mucin
  flavor: snotty
  color: "#b1d8c1"
  recognizable: true
  physicalDesc: reagent-physical-desc-viscous
  slipData:
    requiredSlipSpeed: 4.0 #It's not as slippery as water
  friction: 0.4
  evaporationSpeed: 15.0
  footstepSound:
    collection: FootstepBlood
    params:
      volume: 6

- type: reagent
  id: BloodAllulalo
  name: reagent-name-bloodallulalo
  group: Biological
  desc: reagent-desc-bloodallulalo
  physicalDesc: reagent-physical-desc-thin
  flavor: allulalo
  color: "#c1c7d3"
  evaporationSpeed: 0.3 #same as water
  metabolisms: #have to redefine from basealcohol otherwise its slippery which is a hell of a can of worms for a species
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.06
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
  tileReactions:
  - !type:FlammableTileReaction
    temperatureMultiplier: 1.35
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 0.25
  - !type:PlantAdjustWater
    amount: 0.7
