- type: markingsGroup
  id: Kodepiia
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.LLeg:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKodepiia
  name: Kodepiia appearance
  components:
  - type: Inventory
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Kodepiia/displacement.rsi
            state: jumpsuit
      gloves:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Kodepiia/displacement.rsi
            state: hands
  - type: InitialBody
    organs:
      Torso: OrganKodepiiaTorso
      Head: OrganKodepiiaHead
      ArmLeft: OrganKodepiiaArmLeft
      ArmRight: OrganKodepiiaArmRight
      LegLeft: OrganKodepiiaLegLeft
      LegRight: OrganKodepiiaLegRight
      FootLeft: OrganKodepiiaFootLeft
      FootRight: OrganKodepiiaFootRight
      Brain: OrganKodepiiaBrain
      Eyes: OrganKodepiiaEyes
      Tongue: OrganKodepiiaTongue
      Appendix: OrganKodepiiaAppendix
      Ears: OrganKodepiiaEars
      Lungs: OrganKodepiiaLungs
      Heart: OrganKodepiiaHeart
      Stomach: OrganKodepiiaStomach
      Liver: OrganKodepiiaLiver
      Kidneys: OrganKodepiiaKidneys
  - type: HumanoidProfile
    species: Kodepiia
  - type: Sprite #have to redefine so that the arms are drawn above clothes.
    layers:
    # Torso
    - map: [ "enum.HumanoidVisualLayers.Chest" ]

    # Head
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]

    # Limbs
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]

    # Underwear & clothing
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    - map: ["jumpsuit"]

    # Extremities
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]

    # Stuff that goes over the body but below equipment
    - map: ["enum.HumanoidVisualLayers.Overlay"]

    # More equipment
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "suitstorage" ]

    # Stuff that goes in front of equipment
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]

    # Kodepiiae arms are drawn in front of everything else
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]

    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]

    # Extra stuff
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false

