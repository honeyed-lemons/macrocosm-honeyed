- type: entity
  name: young kodepiia
  parent: [ MobCombat, SimpleMobBase ]
  id: MobYoungKodepiia
  description: Not quite a not-quite-person.
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Aliens/young-kodepiia.rsi
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: young-kodepiia
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: eyes
      shader: unshaded
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        young-kodepiia: Pastel
  - type: Appearance
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: KodepiiaStep
  - type: Bloodstream
    bloodReagent: BloodKodepiia
  - type: Butcherable
    spawned:
      - id: FoodMeatKodepiia
        amount: 1
  - type: NpcFactionMember
    factions:
      - Passive
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: young-kodepiia
        BaseUnshaded: eyes
      Dead:
        Base: young-kodepiia-dead
        BaseUnshaded: eyes-dead
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
