    soundHit:
      collection: BoxingHit
    damage:
      types:
        Blunt: 5
        Cellular: 0.01
  - type: ReplacementAccent
    accent: kodepiia
  - type: Speech
    speechSounds: Kodepiia
    speechVerb: Kodepiia
    allowedEmotes: ['Scream', 'Whistle', 'Hiss', 'Boom', 'KodeRing', 'KodeHonk', 'KodePew', 'KodeBeep', 'KodeRev', 'Click', 'Chitter', 'Squeak', 'Caw', 'Chirp', 'Squish', 'Bubble', 'Pop', 'Coo']
  - type: Vocal
    sounds:
      Male: YoungKodepiia
      Female: YoungKodepiia
      Unsexed: YoungKodepiia
    wilhelmProbability: 0.001
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      collection: KodepiiaDeathgasp
      params:
        variation: 0.125
  - type: NoSlip
  - type: NPCRetaliation
    anyInteraction: true
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - VimPilot
    - MultitoolDefibrillatorTarget
  - type: CanEscapeInventory
    baseResistTime: 2
  - type: TypingIndicator
    proto: kodepiia
  - type: Body
    prototype: Kodepiia
    requiredLegs: 2
  - type: GhostTakeoverAvailable
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-young-kodepiia-name
    description: ghost-role-information-young-kodepiia-description
    rules: ghost-role-information-freeagent-rules
    raffle:
      settings: short
  - type: ConsumeAction
    popupSelfStart: kodepiia-consume-start-self
    popupSelfEnd: kodepiia-consume-end-self
    popupOthersStart: kodepiia-consume-start-others
    popupOthersEnd: kodepiia-consume-end-self
    consumeActionId: ActionKodepiiaConsume
    damage:
      groups:
        Genetic: 5
    whitelist:
      components:
      - Respirator
      - Bloodstream
    blacklist:
      components:
      - SiliconLawBound
    percentageConsumed: 0.25
    canGib: false
